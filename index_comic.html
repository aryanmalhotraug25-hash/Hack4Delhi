<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Screen Looping Image Slider</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: sans-serif;
}

/* SLIDER */
.slider {
  display: flex;
  width: 100vw;
  height: 100vh;
  overflow-x: scroll;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
}

.slider::-webkit-scrollbar {
  display: none;
}

/* SLIDE */
.slide {
  flex: none;
  width: 100vw;
  height: 100vh;
  scroll-snap-align: start;

  background-size: contain;      /* NO CROPPING */
  background-repeat: no-repeat;
  background-position: center;
  background-color: #000;
}

/* IMAGES */
.slide:nth-child(1) { background-image: url('comic/K.jpg'); }
.slide:nth-child(2) { background-image: url('comic/L.jpg'); }
.slide:nth-child(3) { background-image: url('comic/M.jpg'); }
.slide:nth-child(4) { background-image: url('comic/N.jpg'); }
.slide:nth-child(5) { background-image: url('comic/O.jpg'); }

/* DOTS */
.dots {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}

.dots a {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #aaa;
  display: block;
}

/* ARROWS */
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  color: white;
  background: rgba(0,0,0,0.5);
  padding: 10px 16px;
  cursor: pointer;
  user-select: none;
}

.arrow:hover {
  background: rgba(0,0,0,0.8);
}

.arrow.left {
  left: 20px;
}

.arrow.right {
  right: 20px;
}
</style>
</head>

<body>

<!-- SLIDER -->
<div class="slider" id="slider">
  <div class="slide" id="slide1"></div>
  <div class="slide" id="slide2"></div>
  <div class="slide" id="slide3"></div>
  <div class="slide" id="slide4"></div>
  <div class="slide" id="slide5"></div>
</div>

<!-- ARROWS -->
<div class="arrow left" onclick="prevSlide()">&#10094;</div>
<div class="arrow right" onclick="nextSlide()">&#10095;</div>

<!-- DOTS -->
<div class="dots">
  <a href="#slide1"></a>
  <a href="#slide2"></a>
  <a href="#slide3"></a>
  <a href="#slide4"></a>
  <a href="#slide5"></a>
</div>

<script>
const slider = document.getElementById("slider");
const totalSlides = slider.children.length;
let index = 0;

/* NEXT */
function nextSlide() {
  index = (index + 1) % totalSlides;
  slider.scrollTo({
    left: index * window.innerWidth,
    behavior: "smooth"
  });
}

/* PREVIOUS */
function prevSlide() {
  index = (index - 1 + totalSlides) % totalSlides;
  slider.scrollTo({
    left: index * window.innerWidth,
    behavior: "smooth"
  });
}

/* UPDATE INDEX ON MANUAL SCROLL / SWIPE */
slider.addEventListener("scroll", () => {
  index = Math.round(slider.scrollLeft / window.innerWidth);
});
</script>

</body>
</html>
